{{- $fullname := include "reliefgrid.fullname" . -}}
{{- $monitorUser := printf "%s-ui-monitor" $fullname -}}
{{- if eq $monitorUser .Values.rabbitmq.username -}}
{{- $monitorUser = printf "%s-observer" $monitorUser -}}
{{- end -}}
{{- $monitorPassword := randAlphaNum 40 -}}
{{- $existing := lookup "v1" "Secret" .Release.Namespace (printf "%s-rabbitmq" $fullname) -}}
{{- if $existing -}}
{{- if hasKey $existing.data "ui-monitor-password" -}}
{{- $monitorPassword = (index $existing.data "ui-monitor-password" | b64dec | required "existing UI monitor password is empty") -}}
{{- end -}}
{{- end }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "reliefgrid.fullname" . }}-rabbitmq
  labels:
    {{- include "reliefgrid.rabbitmqLabels" . | nindent 4 }}
type: Opaque
data:
  username: {{ .Values.rabbitmq.username | b64enc | quote }}
  password: {{ .Values.rabbitmq.password | b64enc | quote }}
  erlang-cookie: {{ .Values.rabbitmq.erlangCookie | b64enc | quote }}
  {{- $user := .Values.rabbitmq.username | urlquery | replace "+" "%20" }}
  {{- $password := .Values.rabbitmq.password | urlquery | replace "+" "%20" }}
  amqp-url: {{ printf "amqp://%s:%s@%s-rabbitmq:5672/" $user $password (include "reliefgrid.fullname" .) | b64enc | quote }}
  management-url: {{ printf "http://%s:%s@%s-rabbitmq:15672/" $user $password (include "reliefgrid.fullname" .) | b64enc | quote }}
  ui-monitor-username: {{ $monitorUser | b64enc | quote }}
  ui-monitor-password: {{ $monitorPassword | b64enc | quote }}
  {{- $monitorUserURL := $monitorUser | urlquery | replace "+" "%20" }}
  {{- $monitorPasswordURL := $monitorPassword | urlquery | replace "+" "%20" }}
  ui-management-url: {{ printf "http://%s:%s@%s-rabbitmq:15672/" $monitorUserURL $monitorPasswordURL $fullname | b64enc | quote }}
  {{- /* A blank node importing definitions skips creation of the default user. */}}
  {{- $definitions := .Files.Get "files/rabbitmq-definitions.json" | fromJson }}
  {{- $_ := set $definitions "users" (list (dict "name" .Values.rabbitmq.username "password" .Values.rabbitmq.password "tags" "administrator") (dict "name" $monitorUser "password" $monitorPassword "tags" "management")) }}
  {{- $_ := set $definitions "permissions" (list (dict "user" .Values.rabbitmq.username "vhost" "/" "configure" ".*" "write" ".*" "read" ".*") (dict "user" $monitorUser "vhost" "/" "configure" "^$" "write" "^$" "read" "^$")) }}
  definitions.json: {{ $definitions | toJson | b64enc | quote }}
