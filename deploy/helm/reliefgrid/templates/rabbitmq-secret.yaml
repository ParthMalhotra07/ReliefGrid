apiVersion: v1
kind: Secret
metadata:
  name: {{ include "reliefgrid.fullname" . }}-rabbitmq
  labels:
    {{- include "reliefgrid.rabbitmqLabels" . | nindent 4 }}
type: Opaque
data:
  username: {{ .Values.rabbitmq.username | b64enc | quote }}
  password: {{ .Values.rabbitmq.password | b64enc | quote }}
  erlang-cookie: {{ .Values.rabbitmq.erlangCookie | b64enc | quote }}
  {{- $user := .Values.rabbitmq.username | urlquery | replace "+" "%20" }}
  {{- $password := .Values.rabbitmq.password | urlquery | replace "+" "%20" }}
  amqp-url: {{ printf "amqp://%s:%s@%s-rabbitmq:5672/" $user $password (include "reliefgrid.fullname" .) | b64enc | quote }}
  management-url: {{ printf "http://%s:%s@%s-rabbitmq:15672/" $user $password (include "reliefgrid.fullname" .) | b64enc | quote }}
