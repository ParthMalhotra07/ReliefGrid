apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: {{ include "reliefgrid.fullname" . }}-rabbitmq
  labels:
    {{- include "reliefgrid.rabbitmqLabels" . | nindent 4 }}
spec:
  serviceName: {{ include "reliefgrid.fullname" . }}-rabbitmq-headless
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/instance: {{ .Release.Name }}
      app.kubernetes.io/component: rabbitmq
  template:
    metadata:
      annotations:
        reliefgrid.io/broker-accounts: ui-monitor-v1
        checksum/definitions: {{ .Files.Get "files/rabbitmq-definitions.json" | sha256sum }}
      labels:
        {{- include "reliefgrid.rabbitmqLabels" . | nindent 8 }}
    spec:
      nodeSelector:
        role: infra
      tolerations:
        - key: role
          operator: Equal
          value: infra
          effect: NoSchedule
      terminationGracePeriodSeconds: 30
      securityContext:
        fsGroup: 999
        fsGroupChangePolicy: OnRootMismatch
      containers:
        - name: rabbitmq
          image: {{ .Values.rabbitmq.image | quote }}
          imagePullPolicy: IfNotPresent
          ports:
            - name: amqp
              containerPort: 5672
            - name: management
              containerPort: 15672
            - name: metrics
              containerPort: 15692
            - name: epmd
              containerPort: 4369
            - name: clustering
              containerPort: 25672
          env:
            - name: RABBITMQ_PID_FILE
              value: /tmp/reliefgrid-rabbitmq.pid
            - name: POD_NAME
              valueFrom:
                fieldRef:
                  fieldPath: metadata.name
            - name: POD_NAMESPACE
              valueFrom:
                fieldRef:
                  fieldPath: metadata.namespace
            - name: RABBITMQ_NODENAME
              value: rabbit@$(POD_NAME).{{ include "reliefgrid.fullname" . }}-rabbitmq-headless.$(POD_NAMESPACE).svc.cluster.local
            - name: RABBITMQ_USE_LONGNAME
              value: "true"
            - name: RABBITMQ_DEFAULT_USER
              valueFrom:
                secretKeyRef:
                  name: {{ include "reliefgrid.fullname" . }}-rabbitmq
                  key: username
            - name: RABBITMQ_DEFAULT_PASS
              valueFrom:
                secretKeyRef:
                  name: {{ include "reliefgrid.fullname" . }}-rabbitmq
                  key: password
            - name: RABBITMQ_ERLANG_COOKIE
              valueFrom:
                secretKeyRef:
                  name: {{ include "reliefgrid.fullname" . }}-rabbitmq
                  key: erlang-cookie
          # No probe execs a command: each rabbitmq-diagnostics call boots a whole
          # Erlang CLI VM (about 1.45 CPU-seconds on kind), which at these periods
          # cost the broker about 0.45-0.65 CPU at idle and, under a 750m limit,
          # took as long as its own 5 s timeout.
          # Startup and readiness: the AMQP listener, which opens only once the
          # broker has booted and closes if the rabbit application stops.
          startupProbe:
            tcpSocket:
              port: amqp
            failureThreshold: 36
            periodSeconds: 5
            timeoutSeconds: 2
          readinessProbe:
            tcpSocket:
              port: amqp
            periodSeconds: 5
            timeoutSeconds: 2
          # Liveness must be answered by the broker's VM: a TCP check is not
          # enough, as the kernel completes the handshake on a listening socket
          # even when the VM is frozen (checked with SIGSTOP on kind). GET / on the
          # management listener is a static page served by that VM. A hung VM is
          # restarted after about a minute; a broker busy under load is not
          # killed for one slow answer.
          livenessProbe:
            httpGet:
              path: /
              port: management
            periodSeconds: 15
            timeoutSeconds: 10
            failureThreshold: 4
          resources:
            {{- toYaml .Values.rabbitmq.resources | nindent 12 }}
          volumeMounts:
            - name: data
              mountPath: /var/lib/rabbitmq
            - name: definitions
              mountPath: /etc/reliefgrid
              readOnly: true
            - name: boot-config
              mountPath: /etc/rabbitmq/conf.d/20-reliefgrid.conf
              subPath: rabbitmq.conf
              readOnly: true
      volumes:
        - name: definitions
          secret:
            secretName: {{ include "reliefgrid.fullname" . }}-rabbitmq
            defaultMode: 0440
            items:
              - key: definitions.json
                path: definitions.json
        - name: boot-config
          configMap:
            name: {{ include "reliefgrid.fullname" . }}-rabbitmq-definitions
  volumeClaimTemplates:
    - metadata:
        name: data
        labels:
          {{- include "reliefgrid.rabbitmqLabels" . | nindent 10 }}
      spec:
        accessModes: [ReadWriteOnce]
        {{- with .Values.rabbitmq.storage.storageClassName }}
        storageClassName: {{ . | quote }}
        {{- end }}
        resources:
          requests:
            storage: {{ .Values.rabbitmq.storage.size }}
