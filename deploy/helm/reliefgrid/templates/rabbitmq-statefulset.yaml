apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: {{ include "reliefgrid.fullname" . }}-rabbitmq
  labels:
    {{- include "reliefgrid.rabbitmqLabels" . | nindent 4 }}
spec:
  serviceName: {{ include "reliefgrid.fullname" . }}-rabbitmq-headless
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/instance: {{ .Release.Name }}
      app.kubernetes.io/component: rabbitmq
  template:
    metadata:
      labels:
        {{- include "reliefgrid.rabbitmqLabels" . | nindent 8 }}
    spec:
      nodeSelector:
        role: infra
      tolerations:
        - key: role
          operator: Equal
          value: infra
          effect: NoSchedule
      terminationGracePeriodSeconds: 30
      securityContext:
        fsGroup: 999
        fsGroupChangePolicy: OnRootMismatch
      containers:
        - name: rabbitmq
          image: {{ .Values.rabbitmq.image | quote }}
          imagePullPolicy: IfNotPresent
          ports:
            - name: amqp
              containerPort: 5672
            - name: management
              containerPort: 15672
            - name: epmd
              containerPort: 4369
            - name: clustering
              containerPort: 25672
          env:
            - name: POD_NAME
              valueFrom:
                fieldRef:
                  fieldPath: metadata.name
            - name: POD_NAMESPACE
              valueFrom:
                fieldRef:
                  fieldPath: metadata.namespace
            - name: RABBITMQ_NODENAME
              value: rabbit@$(POD_NAME).{{ include "reliefgrid.fullname" . }}-rabbitmq-headless.$(POD_NAMESPACE).svc.cluster.local
            - name: RABBITMQ_USE_LONGNAME
              value: "true"
            - name: RABBITMQ_DEFAULT_USER
              valueFrom:
                secretKeyRef:
                  name: {{ include "reliefgrid.fullname" . }}-rabbitmq
                  key: username
            - name: RABBITMQ_DEFAULT_PASS
              valueFrom:
                secretKeyRef:
                  name: {{ include "reliefgrid.fullname" . }}-rabbitmq
                  key: password
            - name: RABBITMQ_ERLANG_COOKIE
              valueFrom:
                secretKeyRef:
                  name: {{ include "reliefgrid.fullname" . }}-rabbitmq
                  key: erlang-cookie
          startupProbe:
            exec:
              command: [rabbitmq-diagnostics, -q, ping]
            failureThreshold: 36
            periodSeconds: 5
            timeoutSeconds: 5
          readinessProbe:
            exec:
              command: [rabbitmq-diagnostics, -q, check_running]
            periodSeconds: 5
            timeoutSeconds: 5
          livenessProbe:
            exec:
              command: [rabbitmq-diagnostics, -q, ping]
            periodSeconds: 10
            timeoutSeconds: 5
          resources:
            {{- toYaml .Values.rabbitmq.resources | nindent 12 }}
          volumeMounts:
            - name: data
              mountPath: /var/lib/rabbitmq
  volumeClaimTemplates:
    - metadata:
        name: data
        labels:
          {{- include "reliefgrid.rabbitmqLabels" . | nindent 10 }}
      spec:
        accessModes: [ReadWriteOnce]
        {{- with .Values.rabbitmq.storage.storageClassName }}
        storageClassName: {{ . | quote }}
        {{- end }}
        resources:
          requests:
            storage: {{ .Values.rabbitmq.storage.size }}
