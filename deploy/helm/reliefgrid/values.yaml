rabbitmq:
  image: rabbitmq:4.3.7-management@sha256:57bcedccc5c75e55ac33e5f3eaeb28529317b5a02fe5e2722a025f2674c8063e
  username: reliefgrid
  password: reliefgrid
  erlangCookie: reliefgrid-local-cookie
  storage:
    size: 1Gi
    storageClassName: standard
  resources:
    requests:
      cpu: 100m
      memory: 384Mi
    limits:
      memory: 1Gi

traefik:
  enabled: true
  image:
    digest: sha256:1336e85aaed293bd63d005086e0dd013b04078b26aaeb1c18b26a2f928af7e65
  versionOverride: v3.7.16
  service:
    spec:
      type: ClusterIP
  nodeSelector:
    role: infra
  tolerations:
    - key: role
      operator: Equal
      value: infra
      effect: NoSchedule

# Default remains the broker-only spike. The explicit app kind profile enables
# application workloads and the existing local storage subchart together.
storage:
  enabled: false

app:
  # Enable only after the coordinator and all nine storage replicas support AgeRequest.
  agingInterval: "0s"
  enabled: false
  metrics:
    enabled: true

  # Explicit opt-in; the course demos (especially manual demo9) stay manual.
  autoscaling:
    enabled: false
    api: {minReplicas: 2, maxReplicas: 6, cpuUtilization: 60}
    matcher: {minReplicas: 1, maxReplicas: 8, queuePerReplica: "4"}
  coordinatorURL: http://storage-coordinator:8080
  callerNamespace: local-dispatcher
  # S4.4: off by default. `make tracing-up` installs deploy/helm/tracing and
  # applies values-tracing.yaml; the API and matcher then export OTLP/HTTP to
  # the Collector (same namespace). The app has no NetworkPolicy restricting
  # their egress, so none needs a Collector rule.
  tracing:
    enabled: false
    endpoint: http://otel-collector:4318
    # Standard OTEL_TRACES_SAMPLER / _ARG, as the storage chart: follow the
    # caller's decision, else keep this fraction (0.1 under load).
    sampler: parentbased_traceidratio
    samplerArg: "1.0"
  nodeSelector:
    role: data
  api:
    replicas: 2
    image: {repository: reliefgrid/api, tag: dev, pullPolicy: Never}
    resources:
      requests: {cpu: 100m, memory: 128Mi}
      limits: {cpu: "1", memory: 512Mi}
  matcher:
    replicas: 2
    image: {repository: reliefgrid/matcher, tag: dev, pullPolicy: Never}
    resources:
      requests: {cpu: 100m, memory: 128Mi}
      limits: {cpu: "1", memory: 512Mi}
  ui:
    replicas: 1
    image: {repository: reliefgrid/ui, tag: dev, pullPolicy: Never}
    resources:
      requests: {cpu: 25m, memory: 32Mi}
      limits: {cpu: 250m, memory: 128Mi}

# Enable only after all application and operational callers send tokens.
internalAuth:
  enabled: false
