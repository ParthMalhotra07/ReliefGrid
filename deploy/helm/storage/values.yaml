# Storage node image, built and kind-loaded by `make storage-image`.
image:
  repository: reliefgrid/storagenode
  tag: dev
  # sha256:... from the registry; when set, the image is referenced by digest
  # and the tag is ignored. Empty on kind, where the image is only kind-loaded.
  digest: ""
  pullPolicy: Never

# Coordinator (S1.5b): one stateless replica on the infra worker. It routes to
# shard leaders and serves /admin; storage pods register and heartbeat to it.
coordinator:
  image:
    repository: reliefgrid/coordinator
    tag: dev
    # As image.digest: when set, the image is referenced by digest.
    digest: ""
    pullPolicy: Never
  resources:
    requests:
      cpu: 50m
      memory: 64Mi
    limits:
      cpu: 500m
      memory: 256Mi

# Raft snapshot profile (M4): demo (1024 / 512 / 30 s) or load (library defaults).
profile: demo
# ?consistency=linearizable: fence (quorum check + FSM wait, no log entry) or
# barrier (served as strong, through the log). barrier is the fallback (S4.1).
strongReadFence: fence
# Deadline on every Apply and read inside a storage node.
requestTimeoutMs: 3000

# Cloud profiles (S5.1, values-gke.yaml): fail the render unless image.digest and
# coordinator.image.digest are set. Off on kind, where images are only kind-loaded by tag.
requireDigests: false

# Raft log, stable store and snapshots only (M3); the SQLite FSM is an emptyDir.
persistence:
  storageClassName: standard
  size: 1Gi

# A StorageClass named persistence.storageClassName, made by this chart. Off on kind, which
# has its own "standard"; values-gke.yaml turns it on (pd-balanced, reclaim Delete, so a
# helm uninstall plus PVC deletion leaves no disk billing). Cluster-scoped: one release per
# cluster may create it.
storageClass:
  create: false
  provisioner: ""
  parameters: {}
  reclaimPolicy: Delete
  volumeBindingMode: WaitForFirstConsumer
  allowVolumeExpansion: true

# sizeLimit of the fsm (derived SQLite FSM) and tmp emptyDirs; empty = no limit (kind). On a
# cloud node they share the boot disk with images, so the kubelet evicts a pod that exceeds them.
emptyDir:
  fsmSizeLimit: ""
  tmpSizeLimit: ""

# v3.1 §23: storage x9.
resources:
  requests:
    cpu: 100m
    memory: 128Mi
  limits:
    cpu: "1"
    memory: 512Mi

# Bearer token for the storage nodes' operator endpoints and the coordinator's
# /admin. Empty: generated on first install and kept.
operatorToken: ""

bootstrap:
  # The Job gives up (and Helm --wait-for-jobs fails) after this long.
  timeoutSeconds: 600
  backoffLimit: 6
  # Verify only: sleep after bootstrapping the first group, before recording
  # BOOTSTRAPPED, so the Job can be killed mid-run at a known point.
  debugHoldSeconds: 0

# Tracing (S4.4). Off by default: the services then install only the W3C
# propagator, so traceparent still flows but nothing is exported. `make
# tracing-up` installs deploy/helm/tracing and applies values-tracing.yaml.
# With tracing on, the pods export OTLP/HTTP to the Collector and the
# coordinator's NetworkPolicy allows egress to it on 4318 (the storage pods'
# egress is not restricted).
tracing:
  enabled: false
  # The Collector's Service, in this namespace (deploy/helm/tracing).
  endpoint: http://otel-collector:4318
  # Standard OTEL_TRACES_SAMPLER / _ARG: follow the caller's decision, else
  # keep this fraction of new traces (1.0 for the demos, 0.1 under load).
  sampler: parentbased_traceidratio
  samplerArg: "1.0"
