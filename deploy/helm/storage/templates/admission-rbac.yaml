# M7 admission (S4.2): a storage pod reads its shard's manifest before it
# opens Raft, and nothing else. Only storagectl (the bootstrap service
# account) writes the manifests.
apiVersion: v1
kind: ServiceAccount
metadata:
  name: storage-node
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "storage.labels" . | nindent 4 }}
    app.kubernetes.io/component: storagenode
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: storage-admission
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "storage.labels" . | nindent 4 }}
    app.kubernetes.io/component: storagenode
rules:
  - apiGroups: [""]
    resources: [configmaps]
    resourceNames: {{ splitList "," (include "storage.manifests" .) | toJson }}
    verbs: [get]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: storage-admission
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "storage.labels" . | nindent 4 }}
    app.kubernetes.io/component: storagenode
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: storage-admission
subjects:
  - kind: ServiceAccount
    name: storage-node
    namespace: {{ .Release.Namespace }}
