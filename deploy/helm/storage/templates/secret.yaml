# Operator bearer token for /mgmt/bootstrap (v3.1 §11). Generated once and
# kept across upgrades, unless operatorToken is set.
{{- $live := lookup "v1" "Secret" .Release.Namespace "storage-operator-token" }}
apiVersion: v1
kind: Secret
metadata:
  name: storage-operator-token
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "storage.labels" . | nindent 4 }}
    app.kubernetes.io/component: operator-token
type: Opaque
data:
  {{- if .Values.operatorToken }}
  token: {{ .Values.operatorToken | b64enc | quote }}
  {{- else if and $live $live.data $live.data.token }}
  token: {{ $live.data.token | quote }}
  {{- else }}
  token: {{ randAlphaNum 40 | b64enc | quote }}
  {{- end }}
