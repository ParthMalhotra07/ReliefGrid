{{- $ring := include "storage.ring" . | fromJson }}
{{- range $s := until (int $ring.shards) }}
{{- $name := printf "storage-shard-%d-manifest" $s }}
{{- $live := lookup "v1" "ConfigMap" $.Release.Namespace $name }}
---
# Bootstrap manifest for shard-{{ $s }} (v3.1 §10, M7). The chart writes it
# once as PENDING; afterwards only storagectl changes it, so a live copy is
# rendered back unchanged. It is kept on uninstall: losing every data disk
# must not erase the record that this group was created (make storage-reset
# deletes it deliberately).
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ $name }}
  namespace: {{ $.Release.Namespace }}
  labels:
    {{- include "storage.labels" $ | nindent 4 }}
    app.kubernetes.io/component: storage-manifest
    reliefgrid.io/shard: {{ $s | quote }}
  annotations:
    helm.sh/resource-policy: keep
data:
{{- if and $live $live.data }}
  {{- toYaml $live.data | nindent 2 }}
{{- else }}
  {{- $peers := list }}
  {{- range $i := until 3 }}
  {{- $pod := printf "storage-shard-%d-%d" $s $i }}
  {{- $peers = append $peers (dict "podName" $pod "address" (printf "%s.storage-shard-%d.%s.svc.cluster.local:7000" $pod $s $.Release.Namespace)) }}
  {{- end }}
  groupId: shard-{{ $s }}
  shard: {{ $s | quote }}
  ringVersion: {{ $ring.ringVersion | int64 | quote }}
  peers: {{ toJson $peers | quote }}
  phase: PENDING
{{- end }}
{{- end }}
