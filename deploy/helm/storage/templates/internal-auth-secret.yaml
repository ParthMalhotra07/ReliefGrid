{{- /* The storage release is the sole owner of BOTH internal HTTP Secrets.
Values are supplied securely; lookup preserves generated keys on upgrades.
Offline/GitOps rendering must supply explicit token values (see runbook). */}}
{{- range $kind := list "internal" "node" }}
{{- $cfg := index $.Values (printf "%sAuth" $kind) }}
{{- $name := printf "reliefgrid-%s-auth" $kind }}
{{- $live := lookup "v1" "Secret" $.Release.Namespace $name }}
{{- $token := $cfg.token }}
{{- if not $token }}
  {{- if and $live $live.data (index $live.data "token") }}
    {{- $token = index $live.data "token" | b64dec }}
  {{- else }}
    {{- $token = randAlphaNum 48 }}
  {{- end }}
{{- end }}
---
apiVersion: v1
kind: Secret
metadata:
  name: {{ $name }}
  namespace: {{ $.Release.Namespace }}
  labels:
    {{- include "storage.labels" $ | nindent 4 }}
    app.kubernetes.io/component: internal-auth
type: Opaque
data:
  token: {{ $token | b64enc | quote }}
  sender-token: {{ default $token $cfg.senderToken | b64enc | quote }}
  {{- if $cfg.previousToken }}
  previous-token: {{ $cfg.previousToken | b64enc | quote }}
  {{- end }}
{{- end }}
