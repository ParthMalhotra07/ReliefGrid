{{- $ring := include "storage.ring" . | fromJson }}
{{- range $s := until (int $ring.shards) }}
---
# Ingress to shard {{ $s }}: data from the namespace, management (bootstrap,
# status) only from operator pods (v3.1 §11). Raft is in storage-shard-{{ $s }}-raft.
# The kubelet's probes also use the mgmt port (8081). They come from the node,
# not a pod, and the CNIs we use (kindnet, Calico, Cilium) let a node reach its
# own pods regardless of policy; a CNI that doesn't would fail every probe.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: storage-shard-{{ $s }}
  namespace: {{ $.Release.Namespace }}
  labels:
    {{- include "storage.labels" $ | nindent 4 }}
    app.kubernetes.io/component: storagenode
    reliefgrid.io/shard: {{ $s | quote }}
spec:
  podSelector:
    matchLabels:
      {{- include "storage.shardSelector" (dict "shard" $s) | nindent 6 }}
  policyTypes: [Ingress]
  ingress:
    - from:
        - podSelector: {}
      ports:
        - port: 8080
          protocol: TCP
    - from:
        - podSelector:
            matchLabels:
              reliefgrid.io/storage-operator: "true"
      ports:
        - port: 8081
          protocol: TCP
---
# Raft (7000) to shard {{ $s }} only from its own group. A pod labelled
# reliefgrid.io/chaos-isolated=true is left out as both target and peer, so
# labelling one replica cuts its Raft traffic both ways while its data and
# management ports stay open (the S2.3 isolate-replica fault). Policies only
# add allows, which is why the cut is an exclusion here rather than a policy
# of its own.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: storage-shard-{{ $s }}-raft
  namespace: {{ $.Release.Namespace }}
  labels:
    {{- include "storage.labels" $ | nindent 4 }}
    app.kubernetes.io/component: storagenode
    reliefgrid.io/shard: {{ $s | quote }}
spec:
  podSelector:
    matchLabels:
      {{- include "storage.shardSelector" (dict "shard" $s) | nindent 6 }}
    matchExpressions:
      - {key: reliefgrid.io/chaos-isolated, operator: NotIn, values: ["true"]}
  policyTypes: [Ingress]
  ingress:
    - from:
        - podSelector:
            matchLabels:
              {{- include "storage.shardSelector" (dict "shard" $s) | nindent 14 }}
            matchExpressions:
              - {key: reliefgrid.io/chaos-isolated, operator: NotIn, values: ["true"]}
      ports:
        - port: 7000
          protocol: TCP
{{- end }}
