# OpenTelemetry Collector (core): OTLP/HTTP in from the services (4318),
# memory_limiter then batch, OTLP/HTTP out to Jaeger. The coordinator's
# NetworkPolicy allows egress here when tracing is on.
apiVersion: v1
kind: ConfigMap
metadata:
  name: otel-collector
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "tracing.labels" . | nindent 4 }}
    app.kubernetes.io/name: otel-collector
data:
  config.yaml: |
    receivers:
      otlp:
        protocols:
          http:
            endpoint: 0.0.0.0:4318
    processors:
      memory_limiter:
        check_interval: 1s
        limit_mib: {{ .Values.collector.memoryLimiter.limitMiB }}
        spike_limit_mib: {{ .Values.collector.memoryLimiter.spikeLimitMiB }}
      batch: {}
    exporters:
      otlphttp/jaeger:
        endpoint: http://jaeger:4318
    service:
      pipelines:
        traces:
          receivers: [otlp]
          processors: [memory_limiter, batch]
          exporters: [otlphttp/jaeger]
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: otel-collector
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "tracing.labels" . | nindent 4 }}
    app.kubernetes.io/name: otel-collector
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: otel-collector
  template:
    metadata:
      labels:
        {{- include "tracing.labels" . | nindent 8 }}
        app.kubernetes.io/name: otel-collector
      annotations:
        checksum/config: {{ toJson .Values.collector | sha256sum }}
    spec:
      {{- include "tracing.infra" . | nindent 6 }}
      automountServiceAccountToken: false
      enableServiceLinks: false
      securityContext:
        {{- include "tracing.podSecurity" . | nindent 8 }}
      containers:
        - name: collector
          image: {{ include "tracing.image" .Values.collector.image }}
          imagePullPolicy: IfNotPresent
          args: ["--config=/etc/otelcol/config.yaml"]
          securityContext:
            {{- include "tracing.containerSecurity" . | nindent 12 }}
          ports:
            - name: otlp-http
              containerPort: 4318
          readinessProbe:
            tcpSocket: {port: otlp-http}
            periodSeconds: 5
          livenessProbe:
            tcpSocket: {port: otlp-http}
            periodSeconds: 10
          resources:
            {{- toYaml .Values.collector.resources | nindent 12 }}
          volumeMounts:
            - name: config
              mountPath: /etc/otelcol
              readOnly: true
      volumes:
        - name: config
          configMap:
            name: otel-collector
---
apiVersion: v1
kind: Service
metadata:
  name: otel-collector
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "tracing.labels" . | nindent 4 }}
    app.kubernetes.io/name: otel-collector
spec:
  type: ClusterIP
  selector:
    app.kubernetes.io/name: otel-collector
  ports:
    - name: otlp-http
      port: 4318
      targetPort: otlp-http
