apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ .Release.Name }}-prometheus
data:
  prometheus.yml: |
    global:
      scrape_interval: 5s
      scrape_timeout: 3s
      evaluation_interval: 5s
    scrape_configs:
      - job_name: reliefgrid-app
        sample_limit: 5000
        target_limit: 64
        label_limit: 16
        kubernetes_sd_configs:
          - role: pod
            namespaces:
              names: [{{ .Release.Namespace | quote }}]
        relabel_configs:
          - source_labels: [__meta_kubernetes_pod_annotation_prometheus_io_scrape]
            regex: "true"
            action: keep
          - source_labels: [__meta_kubernetes_pod_container_port_name]
            regex: metrics
            action: keep
          - source_labels: [__meta_kubernetes_pod_phase]
            regex: Running
            action: keep
          - source_labels: [__meta_kubernetes_pod_label_app_kubernetes_io_component]
            target_label: component
          - source_labels: [__meta_kubernetes_pod_label_app_kubernetes_io_name]
            target_label: application
      - job_name: reliefgrid-broker
        metrics_path: /metrics/detailed
        params:
          family: [queue_coarse_metrics, queue_consumer_count]
          vhost: ["/"]
        static_configs:
          - targets: [{{ printf "%s-rabbitmq.%s.svc:15692" .Values.appRelease .Release.Namespace | quote }}]
        # Server-named projection queues and test vhosts must never produce
        # unbounded series. Only the seven fixed workflow queues are retained.
        metric_relabel_configs:
          - source_labels: [queue]
            regex: 'matching\.(requests|wakeups|dead)|retry\.(5s|30s|120s)|wakeup\.retry\.5s'
            action: keep
          - source_labels: [__name__]
            regex: 'rabbitmq_detailed_queue_(messages_ready|messages_unacked|messages|consumers)'
            action: keep
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ .Release.Name }}-grafana-provisioning
data:
  datasources.yaml: |
    apiVersion: 1
    datasources:
      - name: ReliefGrid
        uid: reliefgrid
        type: prometheus
        access: proxy
        url: http://{{ .Release.Name }}-prometheus:9090
        isDefault: true
        editable: false
  dashboards.yaml: |
    apiVersion: 1
    providers:
      - name: ReliefGrid
        orgId: 1
        folder: ReliefGrid
        type: file
        disableDeletion: true
        editable: false
        updateIntervalSeconds: 10
        options:
          path: /var/lib/grafana/dashboards
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ .Release.Name }}-dashboards
data:
{{ range $path, $_ := .Files.Glob "dashboards/*.json" }}
  {{ base $path }}: |
{{ $.Files.Get $path | indent 4 }}
{{ end }}
