apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ .Release.Name }}-prometheus
automountServiceAccountToken: true
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: {{ .Release.Name }}-discovery
rules:
  - apiGroups: [""]
    resources: [pods]
    verbs: [get, list, watch]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: {{ .Release.Name }}-discovery
subjects:
  - kind: ServiceAccount
    name: {{ .Release.Name }}-prometheus
    namespace: {{ .Release.Namespace }}
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: {{ .Release.Name }}-discovery
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ .Release.Name }}-prometheus
spec:
  replicas: 1
  selector:
    matchLabels: {app.kubernetes.io/instance: {{ .Release.Name }}, app.kubernetes.io/component: prometheus}
  template:
    metadata:
      labels:
        app.kubernetes.io/name: reliefgrid-observability
        app.kubernetes.io/instance: {{ .Release.Name }}
        app.kubernetes.io/component: prometheus
        reliefgrid.io/metrics-scraper: "true"
      annotations:
        checksum/config: {{ include (print $.Template.BasePath "/config.yaml") . | sha256sum }}
    spec:
      serviceAccountName: {{ .Release.Name }}-prometheus
      nodeSelector: {role: infra}
      tolerations: [{key: role, operator: Equal, value: infra, effect: NoSchedule}]
      securityContext: {runAsNonRoot: true, runAsUser: 65534, runAsGroup: 65534, fsGroup: 65534, seccompProfile: {type: RuntimeDefault}}
      containers:
        - name: prometheus
          image: {{ .Values.prometheus.image | quote }}
          imagePullPolicy: IfNotPresent
          args:
            - --config.file=/etc/prometheus/prometheus.yml
            - --storage.tsdb.path=/prometheus
            - --storage.tsdb.retention.time=6h
            - --storage.tsdb.retention.size=512MB
            - --web.listen-address=:9090
          ports: [{name: http, containerPort: 9090}]
          readinessProbe: {httpGet: {path: /-/ready, port: http}, periodSeconds: 2}
          livenessProbe: {httpGet: {path: /-/healthy, port: http}, periodSeconds: 10}
          resources:
            {{- toYaml .Values.prometheus.resources | nindent 12 }}
          securityContext: {allowPrivilegeEscalation: false, readOnlyRootFilesystem: true, capabilities: {drop: [ALL]}}
          volumeMounts:
            - {name: config, mountPath: /etc/prometheus, readOnly: true}
            - {name: data, mountPath: /prometheus}
            - {name: tmp, mountPath: /tmp}
      volumes:
        - name: config
          configMap: {name: {{ .Release.Name }}-prometheus}
        - name: data
          emptyDir: {sizeLimit: 1Gi}
        - name: tmp
          emptyDir: {sizeLimit: 64Mi}
---
apiVersion: v1
kind: Service
metadata:
  name: {{ .Release.Name }}-prometheus
spec:
  type: ClusterIP
  selector: {app.kubernetes.io/instance: {{ .Release.Name }}, app.kubernetes.io/component: prometheus}
  ports: [{name: http, port: 9090, targetPort: http}]
---
{{- if not .Values.grafana.existingSecret }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ .Release.Name }}-grafana
type: Opaque
stringData:
  admin-user: {{ .Values.grafana.adminUser | quote }}
  admin-password: {{ required "grafana.adminPassword or grafana.existingSecret is required" .Values.grafana.adminPassword | quote }}
---
{{- end }}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ .Release.Name }}-grafana
spec:
  replicas: 1
  selector:
    matchLabels: {app.kubernetes.io/instance: {{ .Release.Name }}, app.kubernetes.io/component: grafana}
  template:
    metadata:
      labels:
        app.kubernetes.io/name: reliefgrid-observability
        app.kubernetes.io/instance: {{ .Release.Name }}
        app.kubernetes.io/component: grafana
      annotations:
        checksum/config: {{ include (print $.Template.BasePath "/config.yaml") . | sha256sum }}
    spec:
      automountServiceAccountToken: false
      nodeSelector: {role: infra}
      tolerations: [{key: role, operator: Equal, value: infra, effect: NoSchedule}]
      securityContext: {runAsNonRoot: true, runAsUser: 472, runAsGroup: 472, fsGroup: 472, seccompProfile: {type: RuntimeDefault}}
      containers:
        - name: grafana
          image: {{ .Values.grafana.image | quote }}
          imagePullPolicy: IfNotPresent
          ports: [{name: http, containerPort: 3000}]
          env:
            - name: GF_SECURITY_ADMIN_USER
              valueFrom: {secretKeyRef: {name: {{ default (printf "%s-grafana" .Release.Name) .Values.grafana.existingSecret }}, key: admin-user}}
            - name: GF_SECURITY_ADMIN_PASSWORD
              valueFrom: {secretKeyRef: {name: {{ default (printf "%s-grafana" .Release.Name) .Values.grafana.existingSecret }}, key: admin-password}}
            - {name: GF_USERS_ALLOW_SIGN_UP, value: "false"}
            - {name: GF_PLUGINS_PREINSTALL_DISABLED, value: "true"}
            - {name: GF_PLUGINS_PREINSTALL_AUTO_UPDATE, value: "false"}
            - {name: GF_ANALYTICS_REPORTING_ENABLED, value: "false"}
            - {name: GF_ANALYTICS_CHECK_FOR_UPDATES, value: "false"}
            - {name: GF_ANALYTICS_CHECK_FOR_PLUGIN_UPDATES, value: "false"}
          readinessProbe: {httpGet: {path: /api/health, port: http}, periodSeconds: 2}
          livenessProbe: {httpGet: {path: /api/health, port: http}, periodSeconds: 10}
          resources:
            {{- toYaml .Values.grafana.resources | nindent 12 }}
          securityContext: {allowPrivilegeEscalation: false, readOnlyRootFilesystem: true, capabilities: {drop: [ALL]}}
          volumeMounts:
            - {name: data, mountPath: /var/lib/grafana}
            - {name: tmp, mountPath: /tmp}
            - {name: provisioning, mountPath: /etc/grafana/provisioning/datasources/datasources.yaml, subPath: datasources.yaml, readOnly: true}
            - {name: provisioning, mountPath: /etc/grafana/provisioning/dashboards/dashboards.yaml, subPath: dashboards.yaml, readOnly: true}
            - {name: dashboards, mountPath: /var/lib/grafana/dashboards, readOnly: true}
      volumes:
        - name: data
          emptyDir: {sizeLimit: 512Mi}
        - name: tmp
          emptyDir: {sizeLimit: 128Mi}
        - name: provisioning
          configMap: {name: {{ .Release.Name }}-grafana-provisioning}
        - name: dashboards
          configMap: {name: {{ .Release.Name }}-dashboards}
---
apiVersion: v1
kind: Service
metadata:
  name: {{ .Release.Name }}-grafana
spec:
  type: ClusterIP
  selector: {app.kubernetes.io/instance: {{ .Release.Name }}, app.kubernetes.io/component: grafana}
  ports: [{name: http, port: 3000, targetPort: http}]
