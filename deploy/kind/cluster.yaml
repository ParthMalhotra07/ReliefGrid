# Local kind cluster: 1 control plane, 3 data workers (storage shards) and 1 infra
# worker (coordinator, broker, platform controllers). Create it with `make cluster-up`,
# which passes the node image pinned in tools.mk (KIND_NODE_IMAGE); do not add image:
# lines here. Every host port listens on 127.0.0.1 only and is checked by `make doctor`.
kind: Cluster
apiVersion: kind.x-k8s.io/v1alpha4
name: reliefgrid
networking:
  apiServerAddress: 127.0.0.1
  apiServerPort: 6443
nodes:
  - role: control-plane
  - role: worker
    labels:
      role: data
  - role: worker
    labels:
      role: data
  - role: worker
    labels:
      role: data
  # Only pods that tolerate role=infra:NoSchedule land here.
  - role: worker
    labels:
      role: infra
    kubeadmConfigPatches:
      - |
        kind: JoinConfiguration
        nodeRegistration:
          taints:
            - key: role
              value: infra
              effect: NoSchedule
    # Traefik (later goal) listens on these NodePorts on the infra worker.
    extraPortMappings:
      - containerPort: 30080
        hostPort: 8080
        listenAddress: 127.0.0.1
        protocol: TCP
      - containerPort: 30443
        hostPort: 8443
        listenAddress: 127.0.0.1
        protocol: TCP
