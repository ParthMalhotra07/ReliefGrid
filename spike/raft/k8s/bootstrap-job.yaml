# One-time bootstrap of the spike group. It refuses (and fails) if any peer already
# has Raft state, so re-applying it never creates a second cluster.
apiVersion: batch/v1
kind: Job
metadata:
  name: storage-spike-bootstrap
  namespace: raft-spike
spec:
  backoffLimit: 0
  template:
    metadata:
      labels:
        app: storage-spike-bootstrap
    spec:
      restartPolicy: Never
      nodeSelector:
        role: data
      securityContext:
        runAsNonRoot: true
        runAsUser: 65532
      containers:
        - name: bootstrap
          image: reliefgrid/raft-spike:dev
          imagePullPolicy: Never
          args: [bootstrap-job]
          env:
            - name: POD_NAMESPACE
              valueFrom: {fieldRef: {fieldPath: metadata.namespace}}
            - name: SERVICE
              value: storage-spike
